[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cagent"
version = "0.1.0"
description = "A lightweight Python agent framework combining Plan-Executor and ReAct."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "openai>=1.0",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
cli = ["pyyaml>=6.0"]

[project.scripts]
cagent = "clients.cli.main:main"
cagent-web = "clients.web.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cagent*", "clients*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
