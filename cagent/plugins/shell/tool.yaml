plugin: shell
group: shell
summary: "命令执行工具组"
detail: "提供 shell 命令执行、代码搜索、Git 操作等"

tree:
  - name: run_command
    summary: "执行任意 shell 命令（默认工作目录 = 会话 scratch）"
    detail: |
      执行 shell 命令，返回 stdout/stderr/exit_code。
      命令在默认工作目录下执行，受超时和黑名单限制。

      工作目录约定（重要）：
      - 会话作用域下，默认 cwd 被钉在「会话 scratch 目录」（写安全：相对路径输出天然落会话目录），
        不是项目根。裸相对路径（如 docs/design/）会相对 scratch 解析，找不到项目里的文件。
      - 要访问项目根的文件/目录，请用 workspace:// 逻辑前缀（框架自动改写为项目根物理路径），
        或直接使用绝对路径。这与 shell.sed/shell.rg 等模板工具的相对路径基准一致。
      - 例：ls workspace://docs/design/  等价于  ls /abs/path/to/proj/docs/design/

      参数：
      - command（必填）：完整的 shell 命令
      - timeout（可选，默认 30）：超时秒数
      - cwd（可选，默认会话 scratch）：工作目录（传绝对路径可切到项目根；裸相对路径仍相对 scratch 解析）

      示例：
      run_command(path="shell.run_command", params={"command": "npm test", "timeout": 60})

      规则：
      - 命令在工作目录下执行，不能越界
      - 裸相对路径默认相对「会话 scratch」解析；访问项目根请用 workspace:// 前缀或绝对路径
      - 黑名单命令会被拦截（如 rm -rf /、sudo）
      - stdout/stderr 自动截断
      - 【重要】禁止使用 cat 整读（无法指定行范围，会被静默截断）。
        读取文件请优先用下方 shell.sed（按行范围），
        或 head -n N / tail -n N / awk 'NR>=A && NR<=B' / grep -n 等带行号的命令。
        框架会走行号化视图输出（含续读指令）。
    execute:
      mode: shell
      command_template: null
    params:
      command:
        type: string
        required: true
        description: "完整的 shell 命令"
      timeout:
        type: integer
        default: 30
        description: "超时秒数"
      cwd:
        type: string
        default: null
        description: "工作目录（默认会话 scratch 目录；裸相对路径在此解析，访问项目根请用 workspace:// 或绝对路径）"

  - name: rg
    summary: "按正则搜索文件内容（ripgrep）"
    detail: |
      使用 ripgrep 搜索文件内容。
      框架负责安全执行（超时、目录限制、输出截断）。

      常用参数：
      - pattern：正则表达式（必填）
      - path：搜索路径（默认 .）
      - type：文件类型（如 py、js）
      - glob：文件名过滤（如 *.py）
      - hidden：包含隐藏文件（默认 false）
      - case_insensitive：忽略大小写（默认 false）

      示例：
      rg(pattern="def main", type="py", path="src/")
      rg(pattern="TODO", glob="*.py")

      注意：如系统未安装 rg，会回退到 grep -rn。
    requires:
      cli: rg
      fallback: grep
    execute:
      mode: shell
      command_template: "rg {pattern} {type_opt}{glob_opt}{hidden_opt}{case_opt} {path}"
      fallback_template: "grep -rn {case_grep_opt} {pattern} {path}"
      fallback_condition_templates:
        case_grep_opt: { param: "case_insensitive", format: "-i" }
    params:
      pattern:
        type: string
        required: true
        description: "正则表达式"
      path:
        type: string
        default: "."
        description: "搜索路径（默认当前目录）"
      type:
        type: string
        default: null
        description: "文件类型（如 py、js）"
      glob:
        type: string
        default: null
        description: "文件名过滤（如 *.py）"
      hidden:
        type: boolean
        default: false
        description: "包含隐藏文件"
      case_insensitive:
        type: boolean
        default: false
        description: "忽略大小写"

  - name: fd
    summary: "按文件名模式查找文件（fd）"
    detail: |
      使用 fd 查找文件。
      框架负责安全执行。

      参数：
      - pattern：文件名模式（必填，正则表达式）
      - path：搜索根目录（默认 .）
      - type：类型过滤（f=文件, d=目录, l=链接）
      - extension：扩展名过滤（如 py）
      - hidden：包含隐藏文件（默认 false）
      - max_depth：最大搜索深度（默认无限制）

      示例：
      fd(pattern="test", type="f", extension="py")
      fd(pattern="config", path="src/", max_depth=3)

      注意：如系统未安装 fd，会回退到 find。
    requires:
      cli: fd
      fallback: find
    execute:
      mode: shell
      command_template: "fd {pattern} {type_opt}{ext_opt}{hidden_opt}{depth_opt} {path}"
      fallback_template: "find {path} -name '{pattern}' {type_find_opt}{ext_find_opt}{depth_find_opt}"
    params:
      pattern:
        type: string
        required: true
        description: "文件名模式（正则）"
      path:
        type: string
        default: "."
        description: "搜索根目录"
      type:
        type: string
        default: null
        description: "类型（f/d/l）"
      extension:
        type: string
        default: null
        description: "扩展名（如 py）"
      hidden:
        type: boolean
        default: false
        description: "包含隐藏文件"
      max_depth:
        type: integer
        default: null
        description: "最大搜索深度"

  - name: sed
    summary: "查看文件指定行内容（sed）"
    detail: |
      使用 sed 查看文件指定行范围的内容。

      参数：
      - file：文件路径（必填）
      - start_line：起始行号（必填）
      - end_line：结束行号（必填，$表示末尾）
      - line_numbers：显示行号（默认 true）

      示例：
      sed(file="src/agent.py", start_line=10, end_line=30)
      sed(file="README.md", start_line=1, end_line="$")

      注意：
      - 路径不能超出工作目录
      - end_line 可用 $ 表示文件末尾

      【首选读取工具】读取文件请优先用 sed 而不是 cat：
      - cat 无法指定行范围，大文件必然被静默截断 → 模型看不到全貌会自信乱改
      - sed 按行范围精确读取，框架会走行号化视图（=== <file> | ... | === 头部契约），
        输出 [read] lines A-B of N + 续读指令（grep -n 定位 / sed -n 续读）
      - 推荐流程：先 grep -n 'pattern' <file> 定位目标行号，
        再 sed(file, start_line, end_line) 点读目标区段
    execute:
      mode: shell
      command_template: "sed -n '{start_line},{end_line}p' {file}"
    params:
      file:
        type: string
        required: true
        description: "文件路径"
      start_line:
        type: integer
        required: true
        description: "起始行号"
      end_line:
        type: string
        required: true
        description: "结束行号（数字或 $）"

  - name: git
    summary: "Git 操作子组"
    children:
      - name: status
        summary: "查看 Git 状态"
        detail: |
          执行 git status 查看工作区状态。
        execute:
          mode: shell
          command_template: "git status"
        params: {}

      - name: diff
        summary: "查看 Git 差异"
        detail: |
          执行 git diff 查看差异。

          参数：
          - staged：显示已暂存的差异（默认 false）
          - pathspec：指定文件路径（可选）
        execute:
          mode: shell
          command_template: "git diff {staged_opt} {pathspec}"
        params:
          staged:
            type: boolean
            default: false
            description: "显示已暂存的差异"
          pathspec:
            type: string
            default: null
            description: "指定文件路径"

      - name: log
        summary: "查看 Git 日志"
        detail: |
          执行 git log 查看提交历史。

          参数：
          - oneline：单行格式（默认 true）
          - n：显示条数（默认 10）
          - author：作者过滤（可选）
          - since：时间范围（如 "1 week ago"）

          示例：
          git log(n=20, author="张三")
          git log(since="2024-01-01")
        execute:
          mode: shell
          command_template: "git log {oneline_opt} -n {n} {author_opt}{since_opt}"
        params:
          oneline:
            type: boolean
            default: true
            description: "单行格式"
          n:
            type: integer
            default: 10
            description: "显示条数"
          author:
            type: string
            default: null
            description: "作者过滤"
          since:
            type: string
            default: null
            description: "时间范围"

      - name: add
        summary: "暂存文件"
        detail: |
          执行 git add 暂存文件。

          参数：
          - pathspec：文件路径或 .（必填）

          示例：
          git add(pathspec=".")
          git add(pathspec="src/agent.py")
        execute:
          mode: shell
          command_template: "git add {pathspec}"
        params:
          pathspec:
            type: string
            required: true
            description: "文件路径或 ."

      - name: commit
        summary: "提交代码"
        detail: |
          执行 git commit 提交。

          参数：
          - message：提交信息（必填）
          - all：提交所有已跟踪文件的修改（默认 false）

          示例：
          git commit(message="fix: 修复登录bug")
          git commit(message="feat: 新增搜索功能", all=true)
        execute:
          mode: shell
          command_template: "git commit {all_opt} -m \"{message}\""
        params:
          message:
            type: string
            required: true
            description: "提交信息"
          all:
            type: boolean
            default: false
            description: "提交所有修改"

      - name: push
        summary: "推送到远程"
        detail: |
          执行 git push 推送到远程仓库。

          参数：
          - remote：远程仓库名（默认 origin）
          - branch：分支名（默认当前分支）

          示例：
          git push()
          git push(remote="upstream", branch="main")
        execute:
          mode: shell
          command_template: "git push {remote} {branch}"
        params:
          remote:
            type: string
            default: "origin"
            description: "远程仓库名"
          branch:
            type: string
            default: null
            description: "分支名（默认当前分支）"
